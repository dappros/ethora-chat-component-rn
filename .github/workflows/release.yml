name: Release

run-name: Release ${{ inputs.version || github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes @ethora/chat-component-rn to npm and creates the GitHub release.
#
#   tag job      (manual runs) bumps package.json, package-lock.json and src/version.ts,
#                moves CHANGELOG.md [Unreleased] into the new version, commits, tags and
#                pushes main
#   ci job       the CI workflow (lint, type check, tests, build, package check and the
#                consumer smoke test on two React Native lines) on the release tag
#   package job  checks tag, version and npm, builds the tarball with `npm pack` (the
#                prepack script builds lib/), checks its contents, `npm publish --dry-run`
#   publish job  publishes that tarball with provenance, creates the GitHub release with
#                the CHANGELOG.md section as notes and the tarball attached. Runs in the
#                npm-release environment, add required reviewers there for an approval step.
#
# Two ways in:
#   - Push a tag vYY.M.D on main (npm run release -- --yes --push does this locally).
#   - Run this workflow by hand (Actions > Release > Run workflow).
#
# Dry run (manual only): everything except the pushes, the publishing and the release. The
# version bump is rehearsed on the runner, CI runs on main, the tarball is built and checked
# and `npm publish --dry-run` goes through npm's own checks.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'yy.m.d without leading zeros. Empty = the day after the current version.'
        required: false
        type: string
      dry_run:
        description: 'Run every check and rehearse the release, but do not push, publish or release.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Manual runs only. A tag pushed with GITHUB_TOKEN does not start other
  # workflows, so the jobs that publish live in this file and run after this job.
  tag:
    name: Bump, tag and push
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Bump, commit, tag and push
        id: bump
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REQUESTED" ]; then
            node scripts/release.mjs --yes --push "$REQUESTED"
          else
            node scripts/release.mjs --yes --push
          fi
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # The same checks that gate main, on the commit that will be released.
  ci:
    name: CI on the release
    needs: tag
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.tag || (inputs.dry_run && 'main' || github.ref_name) }}
    permissions:
      contents: read

  package:
    name: Build and check the tarball
    needs: [tag, ci]
    if: ${{ always() && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The tag job's tag (manual run), the pushed tag (tag run), or main (dry run).
      - name: Checkout the release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.tag.outputs.tag || (inputs.dry_run && 'main' || github.ref_name) }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dry run: do what the tag job does, on this runner only. Nothing is pushed.
      - name: Rehearse the version bump (dry run)
        if: ${{ inputs.dry_run }}
        env:
          REQUESTED: ${{ inputs.version }}
          ETHORA_SKIP_TYPECHECK: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REQUESTED" ]; then
            node scripts/release.mjs --yes "$REQUESTED"
          else
            node scripts/release.mjs --yes
          fi

      - name: Read the version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag, version, npm and origin/main
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/release.mjs verify "$TAG"

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/changelog.mjs notes "$VERSION" | tee "$RUNNER_TEMP/notes.md"
          {
            echo "### Release notes for $VERSION"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # npm pack runs the prepack script (clean, then bob build), so lib/ is built here.
      - name: Build the tarball
        id: pack
        run: |
          tarball="$(npm pack --silent | tail -n 1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          ls -l "$tarball"

      - name: Check the package contents
        run: npm run check:package

      # npm's own publish checks on the exact tarball. Uploads nothing.
      - name: npm publish dry run
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./$TARBALL" --dry-run --access public

      - name: Stage the release files
        if: ${{ !inputs.dry_run }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          mkdir -p release
          cp "$TARBALL" release/
          cp "$RUNNER_TEMP/notes.md" release/notes.md

      - name: Upload the release files
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rn-release
          path: release
          if-no-files-found: error
          retention-days: 7

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Dry run complete"
            echo
            echo "Would release \`v$VERSION\`. Nothing was pushed, published or released."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm and GitHub
    needs: package
    if: ${{ always() && needs.package.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional approval gate. Create the environment in the repository settings with
    # required reviewers to approve every publish.
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) and --provenance need npm 11.5.1 or newer.
      - name: Use npm 11 for provenance
        run: npm install -g npm@^11.5.1

      # The tarball that was built and checked is the tarball that ships.
      - name: Download the release files
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rn-release
          path: release

      # Safe to run again after a failure further down: a version that is already on
      # npm is skipped, so "Re-run failed jobs" continues with the GitHub release.
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tarball="$(ls release/*.tgz)"
          name="$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm, not publishing again."
          else
            npm publish "./$tarball" --provenance --access public
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.tgz --clobber
            gh release edit "$TAG" --notes-file release/notes.md
          else
            gh release create "$TAG" release/*.tgz \
              --title "$TAG" --notes-file release/notes.md --verify-tag
          fi
