name: CI

# Runs on pull requests into main, on pushes to main and by hand. The Release workflow
# calls it (workflow_call) for the tag it is about to publish, so a release is only
# published after the same checks that gate main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to check. Empty = the branch the run was started on.'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or commit to check. Empty = the ref that started the run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A new push to a pull request cancels the superseded run of that pull request. Runs on
# main and runs called by the Release workflow are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, type-check, tests, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      # yarn.lock was deliberately removed (expo tooling runs npm here);
      # package-lock.json is the only lockfile, so npm ci is the honest install.
      - run: npm ci
      # Errors only: the codebase carries a few hundred warnings that are not gated yet.
      - name: Lint (errors)
        run: npx eslint . --quiet
      - name: Type-check (consumer-visible surface)
        run: npm run typecheck
      - name: Tests
        run: npx jest --ci
      - name: Release script rules and changelog helpers
        run: npm run test:release
      - name: Build lib/ (JS and declarations)
        run: npm run build
      # What `npm publish` would ship, checked from the file list of `npm pack --dry-run`.
      - name: Check the package contents
        run: npm run check:package

  consumer-smoke:
    name: Consumer smoke (pack → install → tsc, RN ${{ matrix.rn }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Expo SDK 54 consumer — oldest line we still support via peer ranges.
          # reanimated/worklets must be pinned to the SDK 54 line: without a pin
          # npm resolves reanimated@4.5+, whose peer range (RN 0.83–0.86)
          # conflicts with RN 0.81. A real SDK 54 app has them pinned by
          # `expo install` the same way.
          - rn: 0.81.5
            react: 19.1.0
            types-react: ~19.1.0
            reanimated: ~4.1.0
            worklets: ~0.5.0
          # Expo SDK 57 consumer — the line the repo itself is on.
          - rn: 0.86.2
            react: 19.2.8
            types-react: ~19.2.0
            reanimated: ~4.5.1
            worklets: ~0.10.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Produce a tarball as if we were about to `npm publish`. `npm pack`
      # runs the `prepack` script, so it builds the .d.ts emit first.
      - name: Pack SDK
        id: pack
        run: |
          # prepack builds lib/ and bob prints to stdout; the tarball name is the last line
          TARBALL=$(npm pack --silent | tail -n 1)
          echo "tarball=$PWD/$TARBALL" >> "$GITHUB_OUTPUT"
      # Stand up a tiny consumer project that mirrors what a real RN/Expo
      # app's tsconfig looks like. Install the packed SDK; run tsc on a
      # one-liner that imports the public surface. This catches the
      # "ships raw .ts → 200 errors" class of regression before publish.
      - name: Set up consumer fixture
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          cat > package.json <<EOF
          {
            "name": "consumer-smoke",
            "version": "0.0.0",
            "private": true,
            "dependencies": {
              "react": "${{ matrix.react }}",
              "react-native": "${{ matrix.rn }}",
              "react-native-reanimated": "${{ matrix.reanimated }}",
              "react-native-worklets": "${{ matrix.worklets }}"
            },
            "devDependencies": {
              "@types/react": "${{ matrix.types-react }}",
              "typescript": "~5.9.0"
            }
          }
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "strict": true,
              "jsx": "react-native",
              "lib": ["DOM", "ESNext"],
              "module": "esnext",
              "moduleResolution": "bundler",
              "skipLibCheck": true,
              "esModuleInterop": true,
              "target": "ESNext",
              "noEmit": true
            },
            "include": ["index.ts"]
          }
          EOF
          cat > index.ts <<'EOF'
          import { Chat, XmppProvider } from '@ethora/chat-component-rn';
          // Touch the imports so they aren't elided.
          export const sdk = { Chat, XmppProvider };
          EOF
          npm install --silent --no-audit --no-fund
          npm install --silent --no-save "${{ steps.pack.outputs.tarball }}"
      - name: Consumer tsc
        run: |
          cd /tmp/consumer
          npx tsc --noEmit -p tsconfig.json
