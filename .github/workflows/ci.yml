name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # yarn.lock was deliberately removed (expo tooling runs npm here);
      # package-lock.json is the only lockfile, so npm ci is the honest install.
      - run: npm ci
      - name: Type-check (consumer-visible surface)
        run: ./node_modules/.bin/tsc --noEmit --moduleResolution bundler --module esnext -p tsconfig.json
      - name: Tests
        run: npx jest --ci
      - name: Build declarations
        run: npm run build

  consumer-smoke:
    name: Consumer smoke (pack → install → tsc, RN ${{ matrix.rn }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Expo SDK 54 consumer — oldest line we still support via peer ranges.
          # reanimated/worklets must be pinned to the SDK 54 line: without a pin
          # npm resolves reanimated@4.5+, whose peer range (RN 0.83–0.86)
          # conflicts with RN 0.81. A real SDK 54 app has them pinned by
          # `expo install` the same way.
          - rn: 0.81.5
            react: 19.1.0
            types-react: ~19.1.0
            reanimated: ~4.1.0
            worklets: ~0.5.0
          # Expo SDK 57 consumer — the line the repo itself is on.
          - rn: 0.86.2
            react: 19.2.8
            types-react: ~19.2.0
            reanimated: ~4.5.1
            worklets: ~0.10.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Produce a tarball as if we were about to `npm publish`. `npm pack`
      # runs the `prepack` script, so it builds the .d.ts emit first.
      - name: Pack SDK
        id: pack
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=$PWD/$TARBALL" >> "$GITHUB_OUTPUT"
      # Stand up a tiny consumer project that mirrors what a real RN/Expo
      # app's tsconfig looks like. Install the packed SDK; run tsc on a
      # one-liner that imports the public surface. This catches the
      # "ships raw .ts → 200 errors" class of regression before publish.
      - name: Set up consumer fixture
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          cat > package.json <<EOF
          {
            "name": "consumer-smoke",
            "version": "0.0.0",
            "private": true,
            "dependencies": {
              "react": "${{ matrix.react }}",
              "react-native": "${{ matrix.rn }}",
              "react-native-reanimated": "${{ matrix.reanimated }}",
              "react-native-worklets": "${{ matrix.worklets }}"
            },
            "devDependencies": {
              "@types/react": "${{ matrix.types-react }}",
              "typescript": "~5.9.0"
            }
          }
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "strict": true,
              "jsx": "react-native",
              "lib": ["DOM", "ESNext"],
              "module": "esnext",
              "moduleResolution": "bundler",
              "skipLibCheck": true,
              "esModuleInterop": true,
              "target": "ESNext",
              "noEmit": true
            },
            "include": ["index.ts"]
          }
          EOF
          cat > index.ts <<'EOF'
          import { Chat, XmppProvider } from '@ethora/chat-component-rn';
          // Touch the imports so they aren't elided.
          export const sdk = { Chat, XmppProvider };
          EOF
          npm install --silent --no-audit --no-fund
          npm install --silent --no-save "${{ steps.pack.outputs.tarball }}"
      - name: Consumer tsc
        run: |
          cd /tmp/consumer
          npx tsc --noEmit -p tsconfig.json
